  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f5;
      --panel: #ffffff;
      --ink: #15211d;
      --muted: #66756f;
      --line: #dce5e1;
      --line-strong: #c8d6d0;
      --accent: #0f766e;
      --accent-strong: #0b5d57;
      --accent-soft: #e8f5f2;
      --danger: #b42318;
      --ok: #116b35;
      --shadow: 0 18px 50px rgba(19, 43, 35, .08);
      --shadow-soft: 0 8px 24px rgba(19, 43, 35, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 8% 0%, rgba(15, 118, 110, .08), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    body > header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid rgba(220, 229, 225, .8);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .wrap { max-width: 1280px; margin: 0 auto; }
    [hidden] { display: none !important; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand-block { min-width: 0; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #a7b2ad; }
    .connection-pill.ready { color: var(--accent-strong); border-color: #b9dcd3; background: #f0faf7; }
    .connection-pill.ready .connection-dot { background: #17a673; box-shadow: 0 0 0 3px rgba(23, 166, 115, .12); }
    .settings-button { display: inline-flex; align-items: center; gap: 7px; }
    .settings-button svg { width: 17px; height: 17px; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 36px); letter-spacing: -.035em; }
    .tagline { margin: 4px 0 0; color: var(--muted); }
    main { padding: 24px 16px 48px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); gap: 20px; align-items: start; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .workspace-intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .workspace-intro h2 { margin-bottom: 3px; }
    .workspace-intro p { margin: 0; color: var(--muted); font-size: 13px; }
    .workflow-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 14px;
      padding: 0;
      list-style: none;
    }
    .workflow-step button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 48px;
      padding: 7px 9px;
      text-align: left;
      color: var(--muted);
      background: #f8faf9;
    }
    .workflow-step.current button { color: var(--accent-strong); border-color: #9dccbf; background: var(--accent-soft); }
    .workflow-step.complete button { color: var(--ink); }
    .step-number {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      margin-right: 8px;
      border-radius: 50%;
      background: #e6ece9;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .workflow-step.current .step-number { background: var(--accent); color: #fff; }
    .workflow-step.complete .step-number { background: #dff2eb; color: var(--accent-strong); }
    .step-copy { display: grid; line-height: 1.25; }
    .step-copy strong { font-size: 12px; }
    .step-copy small { font-size: 10px; color: inherit; opacity: .78; }
    .onboarding-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #a9d3c8;
      border-radius: 14px;
      background: linear-gradient(135deg, #edf9f5, #f9fcfb);
    }
    .onboarding-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 850; }
    .onboarding-card h3 { margin: 0 0 2px; font-size: 15px; }
    .onboarding-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    button, select, input {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    button { cursor: pointer; font-weight: 650; transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    button:hover:not(:disabled) { border-color: var(--line-strong); background: #f8faf9; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(15, 118, 110, .18); }
    button.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
    button:disabled { opacity: .48; cursor: not-allowed; }
