<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAS FormFlow</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f5;
      --panel: #ffffff;
      --ink: #17201b;
      --muted: #647067;
      --line: #dce1da;
      --accent: #176b57;
      --accent-strong: #0f4f40;
      --danger: #b42318;
      --ok: #116b35;
      --shadow: 0 12px 28px rgba(23, 32, 27, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 38px); letter-spacing: 0; }
    .tagline { margin: 4px 0 0; color: var(--muted); }
    main { padding: 18px 16px 34px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 16px; align-items: start; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    button, select, input {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-strong); }
    button:disabled { opacity: .55; cursor: wait; }
    textarea {
      width: 100%;
      min-height: 54vh;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
    }
    h2 { margin: 0 0 10px; font-size: 18px; }
    h3 { margin: 16px 0 8px; font-size: 15px; }
    .status { margin: 10px 0; padding: 10px; border-radius: 6px; background: #eef4f1; color: var(--accent-strong); }
    .status.error { background: #fff1f0; color: var(--danger); }
    .status.ok { background: #edf8f0; color: var(--ok); }
    .list { display: grid; gap: 8px; }
    .item { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fff; }
    .item small { display: block; color: var(--muted); overflow-wrap: anywhere; }
    .item .multiline { white-space: pre-wrap; }
    .result a { color: var(--accent-strong); overflow-wrap: anywhere; }
    .qr {
      display: grid;
      place-items: center;
      width: min(100%, 280px);
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      margin: 8px 0;
    }
    .qr svg { display: block; width: 100%; height: 100%; padding: 12px; }
    .ai-panel {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfa;
    }
    .ai-panel summary { cursor: pointer; font-weight: 700; }
    .ai-panel .hint { margin: 8px 0; color: var(--muted); font-size: 13px; }
    .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
    .field input, .field select { width: 100%; }
    .field.full { grid-column: 1 / -1; }
    textarea.ai-prompt { min-height: 120px; font-family: inherit; }
    .ai-status, .model-info { display: block; margin-top: 8px; color: var(--muted); white-space: pre-wrap; }
    .copybox {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #fbfcfa;
    }
    @media (max-width: 840px) {
      .grid { grid-template-columns: 1fr; }
      textarea { min-height: 46vh; }
      .ai-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      textarea.ai-prompt { min-height: 120px; }
      header { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>GAS FormFlow</h1>
      <p class="tagline" data-i18n="tagline">貼上 AI 產生的 JSON，建立 Google Form、回應 Sheet、公告文案與統計骨架。</p>
    </div>
  </header>
  <main class="wrap">
    <div class="grid">
      <section class="panel">
        <div class="toolbar">
          <select id="exampleSelect" data-testid="example-select" aria-label="載入範例">
            <option value="">載入範例 JSON</option>
            <option value="event">活動報名</option>
            <option value="attendance">出席統計</option>
            <option value="willingness">志工意願</option>
            <option value="feedback">滿意度回饋</option>
          </select>
          <button id="validateBtn" data-testid="validate-button">驗證</button>
          <button id="previewBtn" data-testid="preview-button">預覽</button>
          <button id="createBtn" data-testid="create-button" class="primary">建立表單</button>
        </div>
        <details class="ai-panel" open>
          <summary>AI 產生 JSON（v2）</summary>
          <p class="hint">選擇 AI provider，輸入自己的 API Key 並偵測可用模型。每個 provider 的 Key 與模型會分開儲存在你的 Apps Script Properties，不會顯示或回傳。</p>
          <small id="aiProviderInfo" class="model-info"></small>
          <div class="ai-grid">
            <label class="field">API Provider
              <select id="aiProvider" data-testid="ai-provider">
                <option value="google-gemini">Google Gemini API</option>
                <option value="groq">Groq API</option>
              </select>
            </label>
            <label class="field">API Key
              <input id="aiApiKey" data-testid="ai-api-key" type="password" autocomplete="new-password" placeholder="貼上新的 Key，或留空使用已儲存的 Key">
            </label>
            <label class="field full">支援的模型
              <select id="aiModel" data-testid="ai-model" disabled>
                <option value="">請先偵測模型</option>
              </select>
            </label>
            <label class="field full">描述你想建立的表單
              <textarea id="aiRequirement" data-testid="ai-requirement" class="ai-prompt" placeholder="例如：建立一份 30 人活動報名表，收集姓名、電話、餐點與交通需求，並方便統計。"></textarea>
            </label>
          </div>
          <div class="toolbar">
            <button id="aiDetectBtn" data-testid="ai-detect-models">偵測支援模型</button>
            <button id="aiSaveBtn" data-testid="ai-save-settings">儲存 Key 與模型</button>
            <button id="aiGenerateBtn" data-testid="ai-generate-json" class="primary">AI 產生 JSON</button>
            <button id="aiClearBtn" data-testid="ai-clear-settings">清除 AI 設定</button>
          </div>
          <small id="aiStatus" data-testid="ai-status" class="ai-status">正在讀取 AI 設定...</small>
          <small id="aiModelInfo" class="model-info"></small>
        </details>
        <textarea id="jsonInput" data-testid="json-input" spellcheck="false" aria-label="JSON 輸入"></textarea>
        <div id="status" data-testid="status" class="status">請貼上 GAS FormFlow v1 JSON，或先載入範例。</div>
      </section>
      <aside class="panel">
        <h2>預覽與結果</h2>
        <div id="preview" data-testid="preview" class="list"></div>
        <div id="result" data-testid="result" class="result"></div>
      </aside>
    </div>
  </main>
  <script><?!= include('QrCodeLibrary') ?></script>
  <script>
    const examples = {
      event: {
        schemaVersion: "1.0",
        title: "社區餐會報名",
        description: "請協助填寫參加資訊，方便統計餐點與座位。",
        notice: "若臨時無法參加，請提前告知主辦人。",
        deadlineText: "報名截止：2026/07/10 22:00",
        confirmationMessage: "已收到報名，謝謝。",
        sheetName: "社區餐會報名回應",
        lineMessageTemplate: "【{title}】\n請填寫報名表：\n{publishedUrl}\n\n{deadlineText}\n{notice}",
        analysis: { enabled: true, primaryKey: "name", generateCleanData: true, generateSummary: true, summaryFields: [] },
        items: [
          { key: "name", type: "shortText", title: "姓名", required: true, analysis: { role: "identity" } },
          { key: "phone", type: "shortText", title: "手機", required: true },
          { key: "area", type: "dropdown", title: "所屬區域", required: true, options: ["北區", "中區", "南區", "其他"], analysis: { role: "group", summary: "countOptions" } },
          { key: "meal", type: "multipleChoice", title: "餐點", required: true, options: ["葷食", "素食", "不需餐點"], analysis: { summary: "countOptions" } },
          { key: "companions", type: "scale", title: "同行人數", required: true, lowerBound: 0, upperBound: 5, lowerLabel: "0", upperLabel: "5", analysis: { summary: "averageAndDistribution" } },
          { key: "note", type: "paragraph", title: "備註", required: false }
        ]
      },
      attendance: {
        schemaVersion: "1.0",
        title: "小組出席統計",
        description: "每週聚會出席與代禱事項整理。",
        deadlineText: "請於聚會前一天完成填寫。",
        lineMessageTemplate: "【{title}】\n本週出席回覆：{publishedUrl}\n{deadlineText}",
        analysis: { enabled: true, primaryKey: "name", generateCleanData: true, generateSummary: true, summaryFields: [] },
        items: [
          { key: "name", type: "shortText", title: "姓名", required: true },
          { key: "attendance", type: "multipleChoice", title: "本週是否出席", required: true, options: ["會出席", "請假", "尚不確定"], analysis: { summary: "countOptions" } },
          { key: "reason", type: "paragraph", title: "請假或不確定原因", required: false },
          { key: "prayer", type: "paragraph", title: "代禱事項", required: false }
        ]
      },
      willingness: {
        schemaVersion: "1.0",
        title: "志工支援意願調查",
        description: "請選擇可支援的時段與服事項目。",
        notice: "實際分配會由同工再確認。",
        lineMessageTemplate: "【{title}】\n請填寫支援意願：{publishedUrl}\n{notice}",
        analysis: { enabled: true, primaryKey: "name", generateCleanData: true, generateSummary: true, summaryFields: [] },
        items: [
          { key: "name", type: "shortText", title: "姓名", required: true },
          { key: "teams", type: "checkbox", title: "可支援項目", required: true, options: ["接待", "場佈", "餐點", "兒童", "攝影"], analysis: { summary: "countCheckboxOptions" } },
          { key: "availability", type: "checkboxGrid", title: "可支援時段", required: false, rows: ["週六上午", "週六下午", "週日上午"], columns: ["可以", "需要再確認"] },
          { key: "experience", type: "paragraph", title: "相關經驗或限制", required: false }
        ]
      },
      feedback: {
        schemaVersion: "1.0",
        title: "課程滿意度回饋",
        description: "協助我們改善下次課程。",
        lineMessageTemplate: "【{title}】\n課程回饋表：{publishedUrl}",
        analysis: { enabled: true, generateCleanData: true, generateSummary: true, summaryFields: [] },
        items: [
          { key: "overall_score", type: "scale", title: "整體滿意度", required: true, lowerBound: 1, upperBound: 5, lowerLabel: "很不滿意", upperLabel: "很滿意", analysis: { summary: "averageAndDistribution" } },
          { key: "pace", type: "multipleChoice", title: "課程步調", required: true, options: ["太快", "剛好", "太慢"], analysis: { summary: "countOptions" } },
          { key: "favorite", type: "paragraph", title: "最有幫助的內容", required: false },
          { key: "suggestion", type: "paragraph", title: "建議", required: false }
        ]
      }
    };

    const input = document.getElementById('jsonInput');
    const statusEl = document.getElementById('status');
    const previewEl = document.getElementById('preview');
    const resultEl = document.getElementById('result');
    const aiProviderEl = document.getElementById('aiProvider');
    const aiApiKeyEl = document.getElementById('aiApiKey');
    const aiModelEl = document.getElementById('aiModel');
    const aiRequirementEl = document.getElementById('aiRequirement');
    const aiStatusEl = document.getElementById('aiStatus');
    const aiProviderInfoEl = document.getElementById('aiProviderInfo');
    const aiModelInfoEl = document.getElementById('aiModelInfo');
    const buttons = [...document.querySelectorAll('button, select, input')];
    let detectedAiModels = [];
    let hasStoredAiKey = false;
    let savedAiModel = '';

    document.getElementById('exampleSelect').addEventListener('change', (event) => {
      const spec = examples[event.target.value];
      if (!spec) return;
      input.value = JSON.stringify(spec, null, 2);
      setStatus('範例已載入，可以先按「預覽」。', 'ok');
      resultEl.innerHTML = '';
      previewEl.innerHTML = '';
    });
    document.getElementById('validateBtn').addEventListener('click', validateSpec);
    document.getElementById('previewBtn').addEventListener('click', previewSpec);
    document.getElementById('createBtn').addEventListener('click', createFlow);
    document.getElementById('aiDetectBtn').addEventListener('click', detectAiModels);
    document.getElementById('aiSaveBtn').addEventListener('click', saveAiSettings);
    document.getElementById('aiGenerateBtn').addEventListener('click', generateJsonWithAi);
    document.getElementById('aiClearBtn').addEventListener('click', clearAiSettings);
    aiProviderEl.addEventListener('change', switchAiProvider);
    aiModelEl.addEventListener('change', renderAiModelInfo);
    input.value = JSON.stringify(examples.event, null, 2);
    window.__e2e = {
      getExampleKeys: () => Object.keys(examples),
      getCurrentJson: () => input.value,
      getStatusText: () => statusEl.textContent,
      hasPreview: () => previewEl.children.length > 0,
      loadExample: (key) => {
        if (!examples[key]) return false;
        input.value = JSON.stringify(examples[key], null, 2);
        return true;
      }
    };
    updateProviderInfo();
    loadAiSettings();

    function switchAiProvider() {
      aiApiKeyEl.value = '';
      hasStoredAiKey = false;
      savedAiModel = '';
      detectedAiModels = [];
      populateAiModels([], '');
      updateProviderInfo();
      loadAiSettings();
    }

    function updateProviderInfo() {
      aiProviderInfoEl.textContent = aiProviderEl.value === 'groq'
        ? 'Groq：推論資料預設不保留；完整 ZDR 需在 Groq Data Controls 啟用，usage metadata 仍會保留。'
        : 'Gemini：模型清單會依目前 Key 動態取得；實際 free tier 與 quota 由 Google 決定。';
      aiApiKeyEl.placeholder = aiProviderEl.value === 'groq'
        ? '貼上 Groq Key，或留空使用已儲存的 Key'
        : '貼上 Gemini Key，或留空使用已儲存的 Key';
    }

    function loadAiSettings() {
      run('apiGetAiSettings', [aiProviderEl.value], (res) => {
        if (!res.ok) {
          setAiStatus((res.errors || ['無法讀取 AI 設定。']).join('\n'), true);
          return;
        }
        hasStoredAiKey = !!res.hasApiKey;
        savedAiModel = res.model || '';
        if (savedAiModel) populateAiModels([{ name: savedAiModel, label: savedAiModel.replace(/^models\//, ''), description: '', inputTokenLimit: 0, outputTokenLimit: 0 }], savedAiModel);
        setAiStatus(hasStoredAiKey ? `${getProviderLabel()} 已儲存 API Key。可偵測最新模型列表，或直接使用已選模型。` : `${getProviderLabel()} 尚未儲存 API Key。請貼上 Key 後偵測模型。`, false);
      });
    }

    function detectAiModels() {
      const apiKey = aiApiKeyEl.value.trim();
      if (!apiKey && !hasStoredAiKey) {
        setAiStatus(`請先輸入 ${getProviderLabel()} API Key。`, true);
        return;
      }
      setAiStatus(`正在向 ${getProviderLabel()} 偵測可用模型...`, false);
      run('apiListAiModels', [aiProviderEl.value, apiKey], (res) => {
        if (!res.ok) {
          setAiStatus((res.errors || ['模型偵測失敗。']).join('\n'), true);
          return;
        }
        detectedAiModels = res.models || [];
        populateAiModels(detectedAiModels, savedAiModel);
        setAiStatus(`偵測到 ${detectedAiModels.length} 個可用的文字生成模型。請選擇後儲存設定。`, detectedAiModels.length === 0);
      });
    }

    function populateAiModels(models, selectedModel) {
      aiModelEl.replaceChildren();
      if (!models.length) {
        aiModelEl.append(new Option('沒有可用模型', ''));
        aiModelEl.disabled = true;
        renderAiModelInfo();
        return;
      }
      models.forEach((model) => {
        const tokens = model.outputTokenLimit ? ` · output ${model.outputTokenLimit.toLocaleString()} tokens` : '';
        aiModelEl.append(new Option(`${model.label}${tokens}`, model.name));
      });
      aiModelEl.disabled = false;
      if (selectedModel && models.some((model) => model.name === selectedModel)) aiModelEl.value = selectedModel;
      renderAiModelInfo();
    }

    function renderAiModelInfo() {
      const selected = detectedAiModels.find((model) => model.name === aiModelEl.value);
      if (!selected) {
        aiModelInfoEl.textContent = aiModelEl.value ? `目前模型：${aiModelEl.value.replace(/^models\//, '')}` : '';
        return;
      }
      const limits = [
        selected.inputTokenLimit ? `輸入上限 ${selected.inputTokenLimit.toLocaleString()}` : '',
        selected.outputTokenLimit ? `輸出上限 ${selected.outputTokenLimit.toLocaleString()}` : ''
      ].filter(Boolean).join('；');
      aiModelInfoEl.textContent = [selected.description, limits].filter(Boolean).join('\n');
    }

    function saveAiSettings() {
      if (!aiModelEl.value) {
        setAiStatus('請先偵測並選擇模型。', true);
        return;
      }
      run('apiSaveAiSettings', [aiProviderEl.value, aiApiKeyEl.value.trim(), aiModelEl.value], (res) => {
        if (!res.ok) {
          setAiStatus((res.errors || ['AI 設定儲存失敗。']).join('\n'), true);
          return;
        }
        aiApiKeyEl.value = '';
        hasStoredAiKey = true;
        savedAiModel = res.model || aiModelEl.value;
        setAiStatus(`${getProviderLabel()} API Key 與模型已安全儲存。使用模型：${savedAiModel.replace(/^models\//, '')}`, false);
      });
    }

    function clearAiSettings() {
      if (!confirm('確定要從 Apps Script Properties 清除已儲存的 API Key 與模型？')) return;
      run('apiClearAiSettings', [aiProviderEl.value], (res) => {
        if (!res.ok) {
          setAiStatus((res.errors || ['AI 設定清除失敗。']).join('\n'), true);
          return;
        }
        aiApiKeyEl.value = '';
        hasStoredAiKey = false;
        savedAiModel = '';
        detectedAiModels = [];
        populateAiModels([], '');
        setAiStatus('AI 設定已清除。', false);
      });
    }

    function generateJsonWithAi() {
      const requirement = aiRequirementEl.value.trim();
      if (!hasStoredAiKey) {
        setAiStatus('請先儲存 API Key 與模型。', true);
        return;
      }
      if (!aiModelEl.value) {
        setAiStatus('請先選擇模型。', true);
        return;
      }
      if (requirement.length < 5) {
        setAiStatus('請更完整地描述想建立的表單。', true);
        return;
      }
      setAiStatus(`${getProviderLabel()} 正在產生並驗證 FormFlow JSON...`, false);
      run('apiGenerateSpecWithAi', [aiProviderEl.value, requirement, aiModelEl.value], (res) => {
        if (res.jsonText) {
          input.value = res.jsonText;
          previewEl.innerHTML = '';
          resultEl.innerHTML = '';
        }
        if (!res.ok) {
          setAiStatus((res.errors || ['AI 產生失敗。']).join('\n'), true);
          return;
        }
        setAiStatus(`JSON 已產生並通過驗證。模型：${String(res.model || '').replace(/^models\//, '')}`, false);
        setStatus('AI 已產生 JSON，可以按「預覽」檢查。', 'ok');
      });
    }

    function getProviderLabel() {
      return aiProviderEl.options[aiProviderEl.selectedIndex]?.text || aiProviderEl.value;
    }

    function setAiStatus(message, isError) {
      aiStatusEl.textContent = message;
      aiStatusEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    function validateSpec() {
      run('apiValidateSpec', [input.value], (res) => {
        if (res.ok) setStatus('JSON 驗證通過。', 'ok');
        else setStatus(res.errors.join('\n'), 'error');
      });
    }

    function previewSpec() {
      run('apiPreviewSpec', [input.value], (res) => {
        if (!res.ok) {
          setStatus(res.errors.join('\n'), 'error');
          return;
        }
        setStatus('預覽已更新。', 'ok');
        renderPreview(res);
      });
    }

    function createFlow() {
      if (!confirm('確定要在你的 Google 帳號建立 Google Form 與 Google Sheet？')) return;
      setStatus('正在建立，請不要關閉視窗...', '');
      run('apiCreateFormFlow', [input.value], (res) => {
        if (!res.ok) {
          setStatus((res.errors || ['建立失敗']).join('\n'), 'error');
          return;
        }
        setStatus('建立完成。', 'ok');
        renderResult(res);
      });
    }

    function run(fn, args, onSuccess) {
      setBusy(true);
      google.script.run
        .withSuccessHandler((res) => { setBusy(false); onSuccess(res); })
        .withFailureHandler((error) => {
          setBusy(false);
          setStatus('操作失敗：' + (error && error.message ? error.message : error), 'error');
        })[fn](...args);
    }

    function renderPreview(data) {
      const form = data.form;
      const sheet = data.sheet;
      previewEl.innerHTML = `
        <div class="item"><strong>${escapeHtml(form.title)}</strong><small class="multiline">${escapeHtml(form.description || '')}</small><small>題目數量：${form.itemCount}</small></div>
        <h3>題目</h3>
        ${form.items.map((item) => `<div class="item"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.key)} · ${escapeHtml(item.type)} · ${item.required ? '必填' : '非必填'}</small>${item.helpText ? `<small class="multiline">${escapeHtml(item.helpText)}</small>` : ''}<small>${escapeHtml([...(item.options || []), ...(item.rows || []), ...(item.columns || [])].join(' / '))}</small></div>`).join('')}
        <h3>Sheet 結構</h3>
        <div class="item"><strong>分頁</strong><small>${sheet.sheets.map(escapeHtml).join(' / ')}</small></div>
        <div class="item"><strong>Clean_Data 欄位</strong><small>${sheet.cleanDataColumns.map(escapeHtml).join(' | ')}</small></div>
        <div class="item"><strong>可統計欄位</strong><small>${sheet.statFields.map(escapeHtml).join(' / ') || '無'}</small></div>
        <div class="item"><strong>不適合自動統計</strong><small>${sheet.nonStatFields.map(escapeHtml).join(' / ') || '無'}</small></div>
        <div class="item"><strong>統計摘要規劃</strong><small>${sheet.summaryPlan.map(escapeHtml).join(' / ')}</small></div>
      `;
    }

    function renderResult(res) {
      const qrSvg = renderQrCode(res.qrCode?.text || res.publishedUrl);
      resultEl.innerHTML = `
        <h3>建立結果</h3>
        <div class="item"><strong>填寫連結</strong><small><a href="${escapeAttr(res.publishedUrl)}" target="_blank">${escapeHtml(res.publishedUrl)}</a></small></div>
        <div class="item"><strong>編輯連結</strong><small><a href="${escapeAttr(res.editUrl)}" target="_blank">${escapeHtml(res.editUrl)}</a></small></div>
        <div class="item"><strong>Sheet</strong><small><a href="${escapeAttr(res.sheetUrl)}" target="_blank">${escapeHtml(res.sheetUrl)}</a></small></div>
        <div class="item"><strong>建立時間</strong><small>${escapeHtml(res.createdAt)}</small></div>
        <h3>QR code</h3>
        <div class="qr">${qrSvg}</div>
        <button onclick="downloadQr()">下載 QR code</button>
        <h3>公告文案</h3>
        <div id="announcement" class="copybox">${escapeHtml(res.announcement)}</div>
        <button onclick="copyAnnouncement()">複製公告</button>
      `;
    }

    function renderQrCode(text) {
      const qr = qrcodegen.QrCode.encodeText(String(text), qrcodegen.QrCode.Ecc.MEDIUM);
      const border = 4;
      const size = qr.size + border * 2;
      const modules = [];
      for (let y = 0; y < qr.size; y++) {
        for (let x = 0; x < qr.size; x++) {
          if (qr.getModule(x, y)) modules.push(`M${x + border},${y + border}h1v1h-1z`);
        }
      }
      window.__lastQrSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${modules.join('')}" fill="#17201b"/></svg>`;
      return window.__lastQrSvg;
    }

    function downloadQr() {
      const blob = new Blob([window.__lastQrSvg || ''], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gas-formflow-qr-code.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function copyAnnouncement() {
      const text = document.getElementById('announcement')?.innerText || '';
      navigator.clipboard.writeText(text).then(() => setStatus('公告文案已複製。', 'ok'));
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function setBusy(busy) {
      buttons.forEach((button) => button.disabled = busy);
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }
  </script>
</body>
</html>
